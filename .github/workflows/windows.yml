name: Windows taskbar meter
on:
  push:
    branches: [main, windows-mihomo]
    paths: ['windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, protocol tests, background host tests, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Public source check
        run: python scripts/check-public.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RouteMeter-Windows-win-x64
          path: |
            dist/RouteMeter-Windows-win-x64.zip
            dist/RouteMeter-Windows-win-x64.zip.sha256
          if-no-files-found: error
